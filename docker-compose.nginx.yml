services:
  usage-api:
    build: .
    container_name: codesome-usage-api
    command: ["serve"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.usage_cache.json:/app/.usage_cache.json
      - ./.codesome_auth.json:/app/.codesome_auth.json
    restart: unless-stopped

  usage-auto-switch:
    build: .
    container_name: codesome-usage-auto-switch
    profiles: ["auto-switch"]
    command: ["auto-switch", "--all", "--min-remaining", "10", "--min-interval", "2m", "--max-interval", "2h"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.usage_cache.json:/app/.usage_cache.json
      - ./.codesome_auth.json:/app/.codesome_auth.json
    restart: unless-stopped
    depends_on:
      - usage-api

  nginx:
    image: nginx:alpine
    container_name: codesome-usage-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - usage-api
    restart: unless-stopped

  cron:
    image: alpine:latest
    container_name: codesome-usage-cron
    depends_on:
      - usage-api
    entrypoint: /bin/sh -c
    command:
      - |
        apk add --no-cache curl
        echo "30 16 * * * curl -s -X POST http://usage-api:8080/api/codesome/reset-all-quotas >> /proc/1/fd/1 2>&1" | crontab -
        crond -f -l 2
    restart: unless-stopped
