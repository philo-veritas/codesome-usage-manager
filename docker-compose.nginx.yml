services:
  usage-api:
    build: .
    container_name: codesome-usage-api
    command: ["serve", "--host", "0.0.0.0"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.usage_cache.json:/app/.usage_cache.json
      - ./.codesome_auth.json:/app/.codesome_auth.json
      - ./codesome-manager.db:/app/codesome-manager.db
    restart: unless-stopped

  usage-auto-switch:
    build: .
    container_name: codesome-usage-auto-switch
    profiles: ["auto-switch"]
    command: ["auto-switch", "--min-remaining", "10", "--min-interval", "2m", "--max-interval", "2h"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.usage_cache.json:/app/.usage_cache.json
      - ./.codesome_auth.json:/app/.codesome_auth.json
      - ./codesome-manager.db:/app/codesome-manager.db
    restart: unless-stopped
    depends_on:
      - usage-api

  nginx:
    image: nginx:alpine
    container_name: codesome-usage-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - usage-api
    restart: unless-stopped
