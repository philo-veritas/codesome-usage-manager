services:
  usage-api:
    build: .
    container_name: claude-usage-api
    command: ["serve"]
    ports:
      - "8055:8080"
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../.usage_cache.json:/app/.usage_cache.json
      - ../.codesome_auth.json:/app/.codesome_auth.json
    environment:
      - ANTHROPIC_BASE_URL
      - ANTHROPIC_AUTH_TOKEN
    restart: unless-stopped

  usage-auto-switch:
    build: .
    container_name: claude-usage-auto-switch
    profiles: ["auto-switch"]
    command: ["auto-switch", "--all", "--min-remaining", "10", "--min-interval", "2m", "--max-interval", "2h"]
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../.usage_cache.json:/app/.usage_cache.json
      - ../.codesome_auth.json:/app/.codesome_auth.json
    restart: unless-stopped
    depends_on:
      - usage-api
