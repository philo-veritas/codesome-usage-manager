services:
  usage-api:
    build: .
    container_name: codesome-usage-api
    command: ["serve"]
    ports:
      - "8055:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.usage_cache.json:/app/.usage_cache.json
      - ./.codesome_auth.json:/app/.codesome_auth.json
      - ./codesome-manager.db:/app/codesome-manager.db
    restart: unless-stopped

  usage-auto-switch:
    build: .
    container_name: codesome-usage-auto-switch
    profiles: ["auto-switch"]
    command: ["auto-switch", "--all", "--min-remaining", "10", "--min-interval", "2m", "--max-interval", "2h"]
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./.usage_cache.json:/app/.usage_cache.json
      - ./.codesome_auth.json:/app/.codesome_auth.json
      - ./codesome-manager.db:/app/codesome-manager.db
    restart: unless-stopped
    depends_on:
      - usage-api
